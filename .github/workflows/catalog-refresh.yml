name: Catalog refresh

# Re-reads on MusicBrainz the discographies members care about, so new albums reach
# "Recent releases" (docs/decouverte.md). Runs on the production database through the
# `production` environment's secret; does nothing until it is set (docs/mise-en-ligne.md § 9).

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - name: Check the production database is configured
        id: config
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::notice::DATABASE_URL_UNPOOLED is not set in the production environment: nothing to do."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.config.outputs.ready == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - if: steps.config.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.config.outputs.ready == 'true'
        name: Refresh discographies (1 request/s)
        run: pnpm catalog:refresh
        env:
          # Direct connection for both: the script never goes through the pooler.
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          MUSICBRAINZ_USER_AGENT: ${{ vars.MUSICBRAINZ_USER_AGENT }}
